<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Top Gear Web — corrida retrô no navegador</title>
    <meta
      name="description"
      content="Jogo de corrida arcade em 3D direto no navegador, no estilo dos clássicos de 16-bit. Corra sozinho contra bots ou crie uma sala e chame os amigos."
    />
    <!-- cor da barra do navegador no mobile; combina com o fundo das telas do jogo -->
    <meta name="theme-color" content="#0b0b1a" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- Card de compartilhamento (WhatsApp, Discord, Twitter). As URLs precisam ser ABSOLUTAS:
         os robôs que montam a prévia não resolvem caminho relativo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Top Gear Web" />
    <meta property="og:title" content="Top Gear Web" />
    <meta
      property="og:description"
      content="Corrida arcade em 3D no navegador. Jogue contra bots ou crie uma sala e chame os amigos."
    />
    <meta property="og:url" content="https://topgearweb.com.br/" />
    <meta property="og:image" content="https://topgearweb.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        /* "manipulation" só desabilita o double-tap-to-zoom, mas AINDA permite pinça — "none"
           desabilita os dois. A página não precisa de pan/scroll nativo (é um jogo em tela cheia
           fixa), então não perde nada relevante. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app { width: 100%; height: 100%; touch-action: none; }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
